**repoleepo.monster** is a documentation-first project workspace. Its entire current content is a freshly scaffolded project knowledge wiki built on the [Open Knowledge Format](https://github.com/earendil-works/okf) (OKF v0.1) under \`docs/wiki/\`, together with the supporting state needed to keep that wiki healthy. There is no application source code yet: the repository is the knowledge base that will grow alongside — and ahead of — whatever code the project accumulates.

Inside \`docs/wiki/\`, \`index.md\` is the entry point and links to the three top-level system documents: \`overview.md\` (this file), \`glossary.md\` (key terms), and \`architecture/file-tree.md\` (a complete annotated file listing). \`pages/\` holds the knowledge graph — three collections (\`concepts/\`, \`entities/\`, \`artifacts/\`) for abstract ideas, concrete named things, and deliverables respectively — seeded from the reference templates in \`pages/TEMPLATES.md\`. \`log.md\` records wiki changes, and \`last_updated.md\` carries the sync timestamp consumed by staleness detection.

The bundle was scaffolded by \`/wiki:init\` on 2026-10-05 and populated with its first real content in the same session. Conventions going forward: new knowledge is recorded via the \`wiki_note_*\` tools (or hand-written pages following \`TEMPLATES.md\`), pages cross-link with \`[[wikilinks]]\`, and \`last_updated.md\` is bumped whenever the wiki is brought back in sync with the rest of the workspace.

# Railway Cron + Internal Networking Pattern

The Railway deployment pattern this project's tracker uses: services in the same project + environment can talk over private networking with zero config via internal DNS (\`<service>.railway.internal\`, Wireguard-encrypted, no public exposure, no egress cost).

## Key facts (verified against docs.railway.com, 2026-10-05)

- **Reference variables**: \`\${{ SERVICE_NAME.VAR }}\` — e.g. set \`DATABASE_URL = \${{ Postgres.DATABASE_URL }}\` on the app service; the variables editor autocompletes. This copies the DB service's connection string, which uses the internal hostname.
- **Cron services**: Settings → "Cron Schedule", standard crontab, **UTC** (0 = Sunday). The service is expected to execute its task and **exit leaving no open resources** (close DB connections!) — otherwise subsequent scheduled runs are skipped while a deployment is \`Active\`.
- **Runs must be ≥ 5 minutes apart**; execution time can vary by a few minutes.
- **No "run now" button** for cron services — to trigger off-schedule, temporarily set the schedule to \`* * * * *\`, or run locally against the DB's \`DATABASE_PUBLIC_URL\`.
- **Restart policy**: \`ON_FAILURE\` with retries makes sense for cron (a failed weekly run retries immediately; idempotent runs make this safe), \`NEVER\` would wait a whole week.
- **TLS**: internal Postgres connections need no SSL; the public TCP proxy does (\`ssl: { rejectUnauthorized: false }\` in node-postgres).

## Source

- \`https://docs.railway.com/cron-jobs.md\` (docs pages are fetchable by appending \`.md\`)
- \`src/db.js\` (pool closes cleanly), \`src/index.js\` (exits after run), \`railway.json\`, \`README.md\` deploy guide
`,

# GitHub Repo Tracker

Weekly GitHub repo harvester deployed as a Railway **Cron service** inside the existing project (project \`03d94f9a-ab01-420f-8509-9c06dbd2f9cd\`), writing to the project's Postgres over Railway private networking.

Its role: turn GitHub repo metrics into a time series. Every Sunday (\`0 3 * * 0\` UTC) it pulls repos from configured sources, upserts them into \`repos\`, writes one \`repo_snapshots\` row per repo (stars, forks, open_issues, watchers, size_kb), and logs the run in \`runs\`. Keyed by GitHub's stable repo id, so renames and cross-source duplicates are deduplicated; same-day reruns are idempotent.

## Details

- **Location**: repo root of \`E:/repoleepo.monster\` — \`src/\` (6 modules), \`sql/\`, \`Dockerfile\`, \`railway.json\`, \`README.md\`
- **Interface**: \`MODE=cron\` (default) runs one harvest and exits cleanly (Railway cron requirement: process terminates, DB pool closed). \`MODE=web\` serves \`/healthz\` and \`POST /run\` (Bearer \`RUN_TOKEN\`) for manual triggering
