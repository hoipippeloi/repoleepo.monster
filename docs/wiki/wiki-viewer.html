# Tracker coverage threshold: all public repos with >50 stars

## Context

The prior decision [[tracker-goal-harvest-all-public-github-repos-not-just-the-to|Tracker goal: harvest ALL public GitHub repos]] left implementation **pending**, with coverage sizing explicitly flagged as the open question ("sized by how complete the user wants coverage to be vs. API rate limits"). It also established the hard constraint: GitHub has no endpoint listing all public repos, and \`GET /search/repositories\` hard-caps at **1,000 results per query**.

In this session the user answered that question directly: **"then get all repos with more than 50 stars."** As of this decision, no code has landed yet (\`src/\` unchanged) — this records the chosen criterion, not a completed implementation.

## The choice

[[github-repo-tracker]]'s weekly discovery target is: **all public GitHub repos with more than 50 stars** (for all users, not just the token account). Implementation will be search-based (\`stars:>50\` in \`GITHUB_SEARCH_QUERIES\` or an equivalent dedicated source), refining the "all public repos" goal into an achievable corpus.

## Alternatives considered

- **Literal "all public repos"** — not implementable via the REST API (prior decision's constraint); hundreds of millions of repos with no enumeration endpoint.
- **\`stars:>0\` sharding** — rejected for now: vastly larger corpus (tens of millions) for marginal value; 50 stars is the user's chosen quality bar.
- **Keep per-owner sources as primary** — rejected: cannot enumerate all logins up front.

## Rationale / how the 1k cap is beatable here

Unlike "everything", the >50-star corpus IS completely enumerable within the search cap: GitHub search accepts star **ranges** (\`stars:50..60\`), so recursive range-splitting (halve any range whose query returns ≥ 1,000 results) yields complete coverage of every repo above the threshold. Star ranges are dense only in the low hundreds, so the tree is shallow. This is the technique the implementation should use; naive \`stars:>50\` alone silently truncates at 1,000.

## Consequences

- Pending work: implement the sharded \`stars:>50\` discovery source (config knob, e.g. \`MIN_STARS\`), then update the [[github-repo-tracker]] entity page — its "update once the all-repos source is implemented" trigger fires then, not now.
- Expect a corpus in the hundreds of thousands — snapshot volume and weekly runtime still need a size estimate; \`FETCH_DETAILS\` default-ON (2 extra calls/repo) may need revisiting at this scale.
- The earlier "harvest all public repos" goal is operationalized, not replaced: >50 stars is its practical approximation.

# Tracker goal: harvest ALL public GitHub repos, not just the token account's

## Context

The user first asked to "store all public repos from https://api.github.com/user/repos each week", which was implemented as the \`GITHUB_SOURCE_SELF=1\` source (commit \`f72a9b9\`): fetch all public repos of the **token's own account**, same upsert + snapshot pipeline. The user then corrected the intent: **"no i want to get all github repos public from all users"** — the goal is every public repo on GitHub, not just their account's.

## The choice

Redefine [[github-repo-tracker]]'s source scope from "token account's repos" to **all public repos from all users**. \`GITHUB_SOURCE_SELF\` (f72a9b9) was built on a misread of intent and is demoted from "the chosen source" to, at most, an optional extra source — the primary source must target the whole public-repo space. Implementation is **pending** as of this decision.

## Alternatives considered

- **Keep \`/user/repos\` as the source** — rejected: it returns only what the token can access (own + collaborator + accessible org repos), fundamentally narrower than "all users".
- **Enumerate \`/users/{owner}/repos\` per owner** — rejected as primary: requires knowing every login up front; no way to enumerate all users via that endpoint.

## Rationale / hard constraint

GitHub offers **no endpoint that lists all public repos** (see learning *GitHub repo-list endpoint semantics*). The only global-ish surface is \`GET /search/repositories\`, which GitHub **hard-caps at 1,000 results per query**. So "all public repos" can only be approximated — e.g. many batched search queries (by stars ranges, creation dates, languages) or an external enumeration stream. The 1k/query ceiling is the binding constraint any implementation must design around; "fetch everything" is not literally achievable via the REST API.

## Consequences

- The tracker's "Sources" contract changes: search-query-based coverage becomes the primary mechanism, sized by how complete the user wants coverage to be vs. API rate limits.
- The [[github-repo-tracker]] entity page must be updated once the all-repos source is implemented (it currently documents \`GITHUB_SOURCE_SELF\` as "user's chosen source").
- Expect many more repos in \`repos\`/\`repo_snapshots\` — snapshot volume and runtime per weekly cron run need a size estimate before choosing query batching.

# Tracker scope: numeric repo stats only

**Context.** The GitHub Repo Tracker initially stored repo metadata alongside metric snapshots: description, language, license, topics, fork/archived flags, GitHub created date, last push date. The user clarified the goal: only numeric repo popularity/collaboration stats over time — collaborators, stars, forks, "these kind of stats" — explicitly not dev/commit activity.

**Decision.** 2026-10-05: scope the tracker to numeric stats only.

- \`repos\` is a slim identity registry (GitHub id, full_name, owner, name, html_url, timestamps).
- \`repo_snapshots\` carries only numbers: stars, forks, open_issues, watchers, collaborators, size_kb.
- Collaborators is sourced as the public **contributor count** (per_page=1 + Link-header page count, 1 req/repo), because GitHub's true collaborator list requires push access to the repo.
- \`FETCH_DETAILS\` defaults ON so watchers + collaborators are captured by default; documented tradeoff (~1,600 repos/hour API budget) and off-switch for very large sets.
- Idempotent \`DROP COLUMN IF EXISTS\` / \`ADD COLUMN IF NOT EXISTS\` migrations keep any already-initialized DB in sync.

**Alternatives considered.**

- Keep metadata columns "just in case" — rejected: user explicitly excluded non-stat data; columns cost storage and dilute the stats-only contract.
- Use the true \`collaborators\` endpoint with contributor fallback — rejected: doubles request cost for every repo the account has no push access to (403s still count against rate limits).

**Consequences.** Dropped fields can't be recovered from history (nothing was ever written back), so re-adding later is safe if requirements change. Analysis queries and docs updated to match.

# Edit batches are atomic — a failed edit means nothing in that batch landed

**Gotcha observed 2026-10-05** (scope-slim session on \`src/db.js\` + README): a multi-edit batch in which 2 of 4 edits failed to match left the other 2 edits **unapplied as well** — batches are atomic, not "apply the ones that match". The assistant initially assumed the matched edits had landed and had to re-check the file to discover they hadn't.

**Working method**: when any edit in a batch fails, treat the entire batch as failed — re-read the target file(s) and re-apply the survivors individually, rather than assuming partial success. Cheap to verify, expensive to assume.

# GitHub repo-list endpoint semantics: /user/repos vs /users/{owner}/repos vs /search

**Discovered 2026-10-05** when the user asked "are we fetching all repos from https://api.github.com/user/repos?" — these three endpoints look interchangeable but mean very different things:

- \`GET /user/repos\` — repos the **authenticated token itself** can access (own + collaborated-on + org repos, depending on token scope); **can include private repos**. The tracker does NOT use this.
- \`GET /users/{owner}/repos?type=all&per_page=100&page=N\` (fallback \`GET /orgs/{owner}/repos\`) — **public** repo list of a named login. Any login works, no special scope. This is what \`GITHUB_OWNERS\` drives (\`collectRepos\` in \`src/github.js\`). No result cap.
- \`GET /search/repositories?q=...\` — public search results, hard-capped by GitHub at **1,000 results per query**. This is what \`GITHUB_SEARCH_QUERIES\` drives.

**Implication if private repos are ever wanted**: would need a switch to \`/user/repos\` with a \`repo\`-scoped token (e.g. a \`GITHUB_SOURCE_SELF=1\` source type — proposed, not decided). Knock-on effects: the collaborators stat comes from the public **contributors** endpoint, which likely returns nothing for private repos, and private-repo stats would land in the same Postgres tables as public ones.

**Rule of thumb**: \`/user/repos\` answers "what can *I* see", \`/users/{owner}/repos\` answers "what does *that login* publicly have".

# GitHub search results: watchers_count equals stargazers_count (not real watchers)

**Discovered 2026-10-05** while auditing the user's example fetch script for the [[github-repo-tracker]].

In GitHub **search results** (\`GET /search/repositories\`), the \`watchers_count\` field is a long-standing GitHub quirk: it **always equals \`stargazers_count\`** — it is not the real watcher/subscriber count.

Consequences for this project:

- Do not read \`watchers_count\` from search payloads and store it as the \`watchers\` snapshot value — it would silently duplicate \`stars\` in \`repo_snapshots\`.
- True watchers (subscribers) are only available from the **per-repo detail endpoint** (\`GET /repos/{owner}/{repo}\`, field \`subscribers_count\`), i.e. only when \`FETCH_DETAILS\` is on.

Same class of trap as the collaborators gating recorded in [[tracker-scope-numeric-repo-stats-only]]: GitHub's list/search endpoints report placeholder values that look real but aren't — verify field semantics against the detail endpoint before storing them.

# Sliced-search sweep numbers: 142k-repo corpus fits weekly cron only with FETCH_DETAILS=0

**Discovered 2026-10-05** during live feasibility measurement of the proposed large-corpus sweep (\`created:>=2022-01-01 stars:>=100\`) for the [[github-repo-tracker]] — this quantifies the open size/FETCH_DETAILS questions left in [[tracker-coverage-threshold-all-public-repos-with-50-stars]].

## Measured corpus sizes (live, 2026-10-05)

- \`created:>=2022-01-01 stars:>=100\` → **142,457 repos**
- \`created:>=2022-01-01 stars:>=50\` → 260,820 repos
- One month slice (Jan 2022, ≥100★) → 2,735 repos; mid-2025 runs ~2,200/month → **monthly slices are too coarse** (each exceeds the 1,000-result cap), **weekly slices fit**
- Star-range splitting (the technique recorded in the coverage decision) and **date-window slicing** are the two complementary axes; recursive halving until every slice's \`total_count\` ≤ ~950.

## Cost model for a full weekly sweep

- ~1,420 result pages + ~300–500 probe requests ≈ **~1,900 search calls** → at the search API's 30 req/min ≈ **65–75 min per sweep** — fits the existing Sunday cron, but search-request pacing must be added.
- Storage: 142k repos × 52 weekly snapshots ≈ 7.4M rows/year — trivial for the project Postgres.

## The real constraint: FETCH_DETAILS at scale

- Watchers + contributor counts cost 2 calls/repo → ~284k calls/week for 142k repos ≈ **57 h on one 5,000 req/h token — infeasible weekly.**
- Realistic options: \`FETCH_DETAILS=0\` for big sweeps (stats-only sweep costs ~3 calls/min — effectively free), keep details for a smaller/higher-threshold set, or spread the detail pass over ~8 tokens (~7 h).

## Gotchas observed in the user's example script

- A **rolling** window (\`created:>=today-730d\`) makes the target move every run — repos age out of the set. Slices and sweeps must use **fixed date bounds** (e.g. \`created:>=2022-01-01\`) for stable time-series and deterministic slicing.
- The script saved only page 1 of search results: its query matched 642 repos but it silently wrote 100. Any sliced-search implementation must page and/or slice — never trust a single search page.

# Railway Cron + Internal Networking Pattern

The Railway deployment pattern this project's tracker uses: services in the same project + environment can talk over private networking with zero config via internal DNS (\`<service>.railway.internal\`, Wireguard-encrypted, no public exposure, no egress cost).

## Key facts (verified against docs.railway.com, 2026-10-05)

- **Reference variables**: \`\${{ SERVICE_NAME.VAR }}\` — e.g. set \`DATABASE_URL = \${{ Postgres.DATABASE_URL }}\` on the app service; the variables editor autocompletes. This copies the DB service's connection string, which uses the internal hostname.
- **Cron services**: Settings → "Cron Schedule", standard crontab, **UTC** (0 = Sunday). The service is expected to execute its task and **exit leaving no open resources** (close DB connections!) — otherwise subsequent scheduled runs are skipped while a deployment is \`Active\`.
- **Runs must be ≥ 5 minutes apart**; execution time can vary by a few minutes.
- **No "run now" button** for cron services — to trigger off-schedule, temporarily set the schedule to \`* * * * *\`, or run locally against the DB's \`DATABASE_PUBLIC_URL\`.
- **Restart policy**: \`ON_FAILURE\` with retries makes sense for cron (a failed weekly run retries immediately; idempotent runs make this safe), \`NEVER\` would wait a whole week.
- **TLS**: internal Postgres connections need no SSL; the public TCP proxy does (\`ssl: { rejectUnauthorized: false }\` in node-postgres).

## Source

- \`https://docs.railway.com/cron-jobs.md\` (docs pages are fetchable by appending \`.md\`)
- \`src/db.js\` (pool closes cleanly), \`src/index.js\` (exits after run), \`railway.json\`, \`README.md\` deploy guide

# GitHub Repo Tracker

Weekly GitHub repo stats harvester deployed as a Railway **Cron service** inside the existing project (project \`03d94f9a-ab01-420f-8509-9c06dbd2f9cd\`), writing to the project's Postgres over Railway private networking. Remote: https://github.com/hoipippeloi/repoleepo.monster

Scope: **numeric repo stats only** — stars, forks, watchers, open issues (+ size). No repo metadata, no dev/commit activity, no collaborator data (dropped 2026-10-05). See [tracker-scope-numeric-repo-stats-only](./tracker-scope-numeric-repo-stats-only.md) and [tracker-coverage-threshold-all-public-repos-with-50-stars](./tracker-coverage-threshold-all-public-repos-with-50-stars.md).

Every Sunday (\`0 3 * * 0\` UTC) it pulls repos from the configured sources, upserts identity into \`repos\`, and writes one \`repo_snapshots\` row per repo per run (stars, forks, open_issues, watchers, size_kb; unique \`(repo_id, run_id)\`). Keyed by GitHub's stable repo id; same-day reruns are idempotent.

## Details

- **Location**: repo root of \`E:/repoleepo.monster\` — \`src/\` (6 modules), \`sql/\`, \`Dockerfile\`, \`railway.json\`, \`README.md\`
- **Sources** (combinable):
  - \`GITHUB_SLICED_SEARCH\` — broad sweeps beyond the 1,000-result search cap: queries with a \`created:>=DATE\` (or \`A..B\`) bound are recursively split into date ranges until every slice has ≤ ~950 results. Added commit \`b0f111e\`; validated live: Jun-2025 \`stars:>=100\` → slices 592+542+(1092→570+522) = 2,226 repos, exact match
  - \`GITHUB_SOURCE_SELF=1\` → \`/user/repos?visibility=public\` — public repos of the token's account; requires \`GITHUB_TOKEN\`
  - \`GITHUB_OWNERS\` → \`/users/{owner}/repos\` (fallback \`/orgs/{owner}/repos\`) — any login, no cap
  - \`GITHUB_SEARCH_QUERIES\` → capped at 1,000 results/query by GitHub
- **Search pacing**: 30 req/min with token, 10/min without (auto-adjusts). A full 142k-repo sweep ≈ 1,900 search calls ≈ 65–75 min/week — see [sliced-search-sweep-numbers-142k-repo-corpus-fits-weekly-cro](./sliced-search-sweep-numbers-142k-repo-corpus-fits-weekly-cro.md)
- **Interface**: \`MODE=cron\` (default) runs once and exits cleanly. \`MODE=web\` serves \`/healthz\` + \`POST /run\` (Bearer \`RUN_TOKEN\`)
- **Configuration**: \`DATABASE_URL\` (reference \`\${{ Postgres.DATABASE_URL }}\`), \`GITHUB_TOKEN\`, source vars, \`FETCH_DETAILS\` (opt-in, watchers-only, 1 call/repo — keep off for big sweeps)
- **Dependencies**: Node ≥ 20, single runtime dep \`pg\`; Dockerfile \`node:22-slim\`; ON_FAILURE restart policy (max 3)
- [railway-cron-internal-networking](./railway-cron-internal-networking.md) — deployment pattern it relies on

## Lifecycle

- First added: 2026-10-05 — built to track repo metrics over time for repoleepo.monster
- 2026-10-05: scope narrowed to stats-only (\`2b6099d\`); \`/user/repos\` self source added (\`f72a9b9\`)
- 2026-10-05: collaborators stat dropped (per user); \`GITHUB_SLICED_SEARCH\` added for the ≥100★-since-2022 sweep (\`b0f111e\`)
- Verification: live GitHub dry-runs for all four source types, sliced-search exact-count validation, web-mode auth checks; DB write path first exercised on first Railway deploy

# Verify endpoint semantics match the user's stated goal before building a data source

## The guideline

When a user request names or pastes a specific API endpoint as the requirement, verify what that endpoint **actually returns** against the goal the user **describes** before implementing. Name similarity ≠ semantic match. If the two diverge, confirm the intended scope in one sentence before writing code.

## When it applies

Any time a user request translates into a data source or integration surface — especially configuring sources for the [[github-repo-tracker]], where sources are defined by GitHub endpoints and env vars.

## Rationale / evidence

2026-10-05, twice in one day on the same endpoint: the user asked for "all public repos from https://api.github.com/user/repos". \`/user/repos\` actually answers "*what can this token see*" (own + collaborator + accessible org repos) — it sounds like "repos of users" but isn't. The assistant implemented \`GITHUB_SOURCE_SELF\` (f72a9b9) fetching the token account's repos; the user then corrected: "no i want to get all github repos public from all users" — a fundamentally different scope. An earlier session had already produced the endpoint-semantics learning for the same confusion. Checking semantics-against-intent up front (one clarifying sentence) would have saved a built-and-reversed commit.

Rule of thumb from the learning: \`/user/repos\` = "what *I* can see", \`/users/{owner}/repos\` = "what *that login* publicly has", \`/search/repositories\` = "what matches this query (max 1,000)".
